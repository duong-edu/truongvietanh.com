name: Health Check (auto-heal stale Cloudflare ASSETS)

# Chạy mỗi 3 tiếng (trước đây mỗi 30 phút — 48 lần/ngày bất kể có code mới hay
# không, tốn phút Actions liên tục và có thể tự kích hoạt thêm redeploy).
# Nếu bất kỳ URL critical nào trả !=200 → tự dispatch deploy.yml để re-deploy.
# Bug gốc: Cloudflare Workers ASSETS thỉnh thoảng bị stale, một số trang trả
# 404 dù file đã upload — re-deploy heal được, nhưng đây chỉ là chữa triệu
# chứng. Nên xử lý tận gốc lý do ASSETS bị stale để bỏ hẳn cron này.

on:
  schedule:
    - cron: '0 */3 * * *' # mỗi 3 tiếng
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    name: Health check + auto-heal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke test
        id: smoke
        continue-on-error: true
        run: bash scripts/smoke-test.sh

      - name: Trigger deploy.yml để heal
        if: steps.smoke.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "❌ Smoke test fail — dispatch deploy.yml để heal stale ASSETS"
          gh workflow run deploy.yml --ref main
      - name: Báo fail (để có notification email)
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Một số trang đang 404 — đã trigger redeploy để heal."
          exit 1
