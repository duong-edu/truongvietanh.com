<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bản đồ phát triển của con — Trắc nghiệm Việt Anh (K-12)</title>
<style>
  :root{
    --ink:#0f2540; --ink2:#33506f; --muted:#6b7c93;
    --brand:#0a5ad6; --brand-dk:#063e95; --teal:#0fb5a6; --gold:#f5a524;
    --bg:#eef3fb; --card:#ffffff; --line:#dce6f4; --good:#19b36b;
    --shadow:0 18px 50px rgba(10,40,90,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink); background:radial-gradient(1200px 600px at 50% -10%,#e0ecff 0%,var(--bg) 55%);
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:26px 14px 60px;}
  .app{width:100%; max-width:560px}
  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .logo{display:flex; align-items:center; gap:9px; font-weight:800; color:var(--brand-dk); letter-spacing:.3px}
  .logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--teal));
    display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;box-shadow:0 6px 14px rgba(10,90,214,.35)}
  .topbar .spacer{flex:1}
  .proofpill{font-size:12px;color:var(--ink2);background:#fff;border:1px solid var(--line);padding:6px 11px;border-radius:999px;font-weight:600}
  .progress-wrap{margin:6px 2px 16px;display:none}
  .progress-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .bar{height:10px;background:#dfe8f6;border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--brand));transition:width .55s cubic-bezier(.4,0,.2,1)}
  .milestones{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .ms{font-size:11.5px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-weight:600}
  .ms.done{color:#0c7a4d;background:#e7f8ef;border-color:#bfeed6}
  .ms.done::before{content:"✓ ";font-weight:900}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 22px;animation:rise .45s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--teal);margin:0 0 8px}
  h1{font-size:25px;line-height:1.22;margin:0 0 12px;color:var(--ink)}
  h2{font-size:21px;line-height:1.3;margin:0 0 6px;color:var(--ink)}
  p.lead{font-size:15.5px;color:var(--ink2);line-height:1.55;margin:0 0 18px}
  .qcount{font-size:13px;color:var(--gold);font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:6px}
  .opts{display:flex;flex-direction:column;gap:11px;margin:14px 0 4px}
  .opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;cursor:pointer;background:#fff;border:1.6px solid var(--line);
    border-radius:14px;padding:15px 15px;font-size:15px;color:var(--ink);transition:.16s;font-weight:600;line-height:1.35}
  .opt:hover{border-color:var(--brand);background:#f5f9ff;transform:translateY(-1px)}
  .opt .ic{width:30px;height:30px;min-width:30px;border-radius:9px;background:#eef3fb;display:grid;place-items:center;font-size:16px}
  .opt.sel{border-color:var(--brand);background:#eef5ff;box-shadow:0 0 0 3px rgba(10,90,214,.12)}
  .grid{display:flex;flex-direction:column;gap:11px}
  .gradecard{cursor:pointer;border:1.6px solid var(--line);border-radius:16px;padding:16px 16px;background:#fff;transition:.16s;display:flex;gap:14px;align-items:center}
  .gradecard:hover{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 10px 24px rgba(10,90,214,.12)}
  .gradecard .emo{font-size:30px}
  .gradecard .gt{font-weight:800;margin:0 0 3px;font-size:16px}
  .gradecard .gs{font-size:12.8px;color:var(--muted);line-height:1.4}
  .gradecard .chev{margin-left:auto;color:var(--muted);font-size:20px}
  .feedback{margin-top:16px;border:1px solid #cfeede;background:#f2fbf6;border-radius:14px;padding:14px 15px;display:none;animation:rise .35s ease both}
  .feedback .fb-top{display:flex;align-items:center;gap:8px;font-weight:800;color:#0c7a4d;font-size:14px;margin-bottom:6px}
  .feedback .fb-body{font-size:13.6px;color:var(--ink2);line-height:1.55}
  .feedback .src{display:block;margin-top:7px;font-size:11.5px;color:var(--muted);font-style:italic}
  .fb-stake{background:#fff5e6;border:1px solid #f3dca7;border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:13.4px;color:#7a5212;line-height:1.5}
  .fb-stake b{color:#9a5b00}
  .proofbar{display:flex;flex-direction:column;gap:3px;background:#fff8ec;border:1px solid #f3e3bd;border-radius:13px;padding:12px 14px;margin-bottom:16px}
  .proofbar .stars{color:var(--gold);font-size:13px;letter-spacing:1px}
  .proofbar .pq{font-size:13.5px;color:var(--ink);font-style:italic;line-height:1.5}
  .proofbar .pw{font-size:11.5px;color:var(--muted);font-weight:600}
  .btn{appearance:none;border:0;cursor:pointer;font-weight:800;font-size:15.5px;border-radius:13px;padding:15px 20px;background:linear-gradient(135deg,var(--brand),var(--brand-dk));color:#fff;width:100%;margin-top:18px;box-shadow:0 12px 24px rgba(10,90,214,.32);transition:.16s}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn.ghost{background:#fff;color:var(--brand-dk);border:1.6px solid var(--line);box-shadow:none}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#e08600);box-shadow:0 12px 24px rgba(245,165,36,.35)}
  .backlink{display:inline-block;margin-top:14px;color:var(--muted);font-size:13px;cursor:pointer;font-weight:600}
  .backlink:hover{color:var(--brand)}
  .analysis{text-align:center;padding:42px 22px}
  .spinner{width:54px;height:54px;border-radius:50%;border:5px solid #e3ecfa;border-top-color:var(--brand);margin:0 auto 22px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .analysis .step{font-size:15px;color:var(--ink2);min-height:24px;font-weight:600}
  .radar-wrap{display:flex;justify-content:center;margin:6px 0 4px}
  .scoreline{display:flex;flex-direction:column;gap:9px;margin:16px 0 4px}
  .axisrow{display:flex;align-items:center;gap:10px;font-size:13.5px}
  .axisrow .nm{width:118px;min-width:118px;font-weight:700;color:var(--ink2)}
  .axisrow .track{flex:1;height:9px;background:#e6eefa;border-radius:999px;overflow:hidden}
  .axisrow .track > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--brand))}
  .axisrow .pc{width:38px;text-align:right;font-weight:800;color:var(--brand-dk)}
  .insightbox{margin-top:16px;border-radius:14px;padding:15px 16px;font-size:14px;line-height:1.6}
  .insightbox.strong{background:#eafaf1;border:1px solid #c3edd3}
  .insightbox.grow{background:#fff7e9;border:1px solid #f5e0b0;margin-top:11px}
  .insightbox b{color:var(--ink)}
  .todo{margin-top:16px;border:1px solid var(--line);border-radius:14px;padding:15px 16px;background:#f7fbff}
  .todo h3{margin:0 0 8px;font-size:15px;color:var(--brand-dk)}
  .todo ol{margin:0;padding-left:20px;color:var(--ink2);font-size:13.8px;line-height:1.65}
  .gate .teaser{border:1px dashed var(--brand);border-radius:14px;padding:16px;background:#f5f9ff;margin:6px 0 16px}
  .gate .teaser .ga{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);font-weight:600;margin-top:8px}
  .gate .teaser .ga .blur{flex:1;height:10px;border-radius:6px;background:linear-gradient(90deg,#bcd4f3,#e6eefb);filter:blur(1.5px)}
  .field{width:100%;padding:14px 14px;border:1.6px solid var(--line);border-radius:12px;font-size:15px;margin-top:10px;font-family:inherit}
  .field:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(10,90,214,.12)}
  .consent{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:12px;color:var(--muted);line-height:1.5}
  .consent input{margin-top:2px}
  .offer .guarantee{display:flex;gap:10px;align-items:flex-start;background:#eafaf1;border:1px solid #c3edd3;border-radius:13px;padding:13px 14px;margin-top:14px;font-size:13.5px;color:var(--ink2);line-height:1.5}
  .offer .guarantee .g-ic{font-size:20px}
  .pts{display:flex;flex-direction:column;gap:9px;margin:14px 0 4px}
  .pt{display:flex;gap:10px;font-size:14.2px;color:var(--ink2);line-height:1.5}
  .pt .c{color:var(--good);font-weight:900}
  .note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px;line-height:1.5}
  .hide{display:none !important}
</style>

<script>
/* ============================================================
   ENGINE — render generic theo QUIZZES / MENU (quiz-data.js)
   Luồng: chọn cấp → (chọn nhóm) → 1 chạm xác nhận lớp/tuổi →
          câu hỏi (progress + phản hồi + stake + proof inline) →
          ảo giác phân tích → CỔNG FORM ZALO → kết quả → offer
   ============================================================ */
const el = document.getElementById('screen');
const progressWrap = document.getElementById('progressWrap');
const state = { quizId:null, idx:0, picked:null, answers:[], childName:null, classLabel:null };
const CUR = ()=> QUIZZES[state.quizId];

function buildMilestones(){
  const q=CUR();
  document.getElementById('milestones').innerHTML =
    q.axes.map((a,i)=>`<span class="ms" data-axis="${i}">${AXSHORT[a]}</span>`).join('');
}
function setProgress(){
  const q=CUR(), list=q.questions, total=list.length;
  const pct=Math.round((state.idx)/total*100);
  document.getElementById('pmBar').style.width=pct+'%';
  document.getElementById('pmPct').textContent=pct+'%';
  document.getElementById('pmLabel').textContent =
     state.idx>=total ? 'Hoàn thành' : ('Câu '+(state.idx+1)+'/'+total+' • '+AXSHORT[q.axes[list[Math.min(state.idx,total-1)].axis]]);
  const asked=Array(q.axes.length).fill(0), tot=Array(q.axes.length).fill(0);
  list.forEach((qq,i)=>{ tot[qq.axis]++; if(i<state.idx) asked[qq.axis]++; });
  document.querySelectorAll('.ms').forEach(m=>{ const a=+m.dataset.axis;
    m.classList.toggle('done', asked[a]>0 && asked[a]===tot[a]); });
}

/* ---------- MÀN HÌNH ĐẦU: chọn cấp ---------- */
function renderWelcome(){
  progressWrap.style.display='none';
  el.innerHTML = `
   <div class="card">
     <p class="eyebrow">Trắc nghiệm 2 phút • Miễn phí</p>
     <h1>Con của anh/chị đang phát triển tới đâu?</h1>
     <p class="lead">Cùng dựng <b>“Bản đồ phát triển”</b> riêng cho con theo đúng 4 lĩnh vực phát triển — <b>Kiến thức · Kỹ năng · Tiếng Anh · Thể chất</b> — thêm <b>Hướng nghiệp</b> ở cấp 2–3. Hãy chọn cấp học của con để bắt đầu.</p>
     <div class="grid" id="levels"></div>
     <p class="note">Mỗi cấp có bộ câu hỏi riêng, phân rã theo giai đoạn phát triển của con.</p>
   </div>`;
  const wrap=document.getElementById('levels');
  MENU.forEach(lv=>{
    const d=document.createElement('div'); d.className='gradecard';
    d.innerHTML=`<div class="emo">${lv.emoji}</div><div><div class="gt">${lv.label}</div><div class="gs">${lv.sub}</div></div><div class="chev">›</div>`;
    d.onclick=()=> lv.groups ? renderGroups(lv) : startQuiz(lv.quiz);
    wrap.appendChild(d);
  });
}

function renderGroups(lv){
  progressWrap.style.display='none';
  el.innerHTML = `
   <div class="card">
     <p class="eyebrow">${lv.label}</p>
     <h2>Con đang ở nhóm nào?</h2>
     <p class="lead">Chọn đúng nhóm để em hỏi những điều sát nhất với giai đoạn của con.</p>
     <div class="grid" id="groups"></div>
     <span class="backlink" id="bk">← Chọn lại cấp học</span>
   </div>`;
  const wrap=document.getElementById('groups');
  lv.groups.forEach(g=>{
    const d=document.createElement('div'); d.className='gradecard';
    d.innerHTML=`<div class="emo">${g.emoji}</div><div><div class="gt">${g.label}</div><div class="gs">${g.sub}</div></div><div class="chev">›</div>`;
    d.onclick=()=>startQuiz(g.quiz);
    wrap.appendChild(d);
  });
  document.getElementById('bk').onclick=renderWelcome;
}

function startQuiz(id){
  state.quizId=id; state.idx=0; state.answers=[]; state.childName=null; state.classLabel=null;
  progressWrap.style.display='block'; buildMilestones(); renderConfirm();
}

/* micro-commitment 1 chạm */
function renderConfirm(){
  setProgress();
  const q=CUR();
  el.innerHTML = `
   <div class="card">
     <p class="eyebrow">Bước 1 • 1 chạm</p>
     <h2>${q.childWord==='bé'?'Bé nhà mình mấy tuổi?':'Con đang học lớp mấy?'}</h2>
     <p class="lead">Chọn xong, em sẽ hỏi đúng những điều quan trọng nhất cho giai đoạn của ${q.childWord}.</p>
     <div class="opts" id="cf"></div>
     <span class="backlink" id="bk">← Quay lại</span>
   </div>`;
  const box=document.getElementById('cf');
  q.confirm.forEach(c=>{ const b=document.createElement('button'); b.className='opt';
    b.innerHTML=`<span class="ic">🎯</span><span>${c}</span>`;
    b.onclick=()=>{ state.classLabel=c; renderQuestion(); }; box.appendChild(b); });
  document.getElementById('bk').onclick=renderWelcome;
}

function renderQuestion(){
  setProgress();
  const q=CUR(), list=q.questions, i=state.idx, item=list[i], total=list.length, remain=total-i;
  state.picked=null;
  const cw=q.childWord;
  const proofBanner = (false /* ẩn */) ? `
     <div class="proofbar"><span class="stars">★★★★★</span>
       <span class="pq">“${q.proof.q}”</span>
       <span class="pw">${q.proof.w} · cùng <b>12.000+</b> phụ huynh đã làm trắc nghiệm</span></div>` : '';
  el.innerHTML = `
   <div class="card">
     ${proofBanner}
     <p class="qcount">🔓 Còn ${remain} câu để mở khoá Bản đồ của ${cw}</p>
     <p class="eyebrow">${q.axes[item.axis]}</p>
     <h2>${item.q}</h2>
     <div class="opts" id="opts">
       ${item.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="ic">${["A","B","C","D"][k]}</span><span>${o.t}</span></button>`).join('')}
     </div>
     <div class="feedback" id="fb"><div class="fb-top">✓ Cảm ơn anh/chị — điều này giúp hiểu ${cw} hơn</div><div class="fb-body" id="fbBody"></div></div>
     <button class="btn" id="next" disabled>Tiếp tục</button>
     ${i>0?'<span class="backlink" id="bk">← Câu trước</span>':''}
   </div>`;
  el.querySelectorAll('#opts .opt').forEach(b=>{
    b.onclick=()=>{
      el.querySelectorAll('#opts .opt').forEach(x=>x.classList.remove('sel'));
      b.classList.add('sel');
      const bucket=item.opts[+b.dataset.k].s; state.picked=bucket;
      const stake=(bucket>=2 && item.stake)?`<div class="fb-stake"><b>💡 Nếu để như hiện tại:</b> ${item.stake}</div>`:'';
      document.getElementById('fbBody').innerHTML = stake + item.fb + `<span class="src">Nguồn: ${item.src}</span>`;
      document.getElementById('fb').style.display='block';
      const nx=document.getElementById('next'); nx.disabled=false;
      nx.textContent=(i===total-1)?('Xem Bản đồ của '+cw+' →'):'Tiếp tục';
    };
  });
  document.getElementById('next').onclick=()=>{
    if(state.picked===null) return;
    state.answers[i]={axis:item.axis,bucket:state.picked}; state.idx++;
    if(state.idx>=total){ renderAnalysis(); } else { renderQuestion(); }
  };
  const bk=document.getElementById('bk'); if(bk) bk.onclick=()=>{ state.idx--; renderQuestion(); };
}

function renderAnalysis(){
  setProgress();
  document.getElementById('pmLabel').textContent='Hoàn thành';
  document.getElementById('pmBar').style.width='100%';
  document.getElementById('pmPct').textContent='100%';
  document.querySelectorAll('.ms').forEach(m=>m.classList.add('done'));
  const q=CUR(), n=q.axes.length, cw=q.childWord;
  el.innerHTML = `<div class="card analysis"><div class="spinner"></div><div class="step" id="st">Đang đối chiếu câu trả lời với ${n} lĩnh vực phát triển của ${cw}…</div></div>`;
  const steps=[`Đang đối chiếu câu trả lời với ${n} lĩnh vực phát triển của ${cw}…`,"Đang xác định điểm sáng &amp; vùng cần đồng hành…",`Đang dựng Bản đồ phát triển cho ${cw}…`];
  let k=0; const st=document.getElementById('st');
  const tk=setInterval(()=>{ k++; if(k<steps.length){ st.innerHTML=steps[k]; } else { clearInterval(tk); renderLeadGate(); } },850);
}

/* === CỔNG THU LEAD: form Zalo TRƯỚC khi xem kết quả === */
function renderLeadGate(){
  const q=CUR(), cw=q.childWord;
  const axRows=q.axes.map(a=>`<div class="ga"><span>🔒</span> ${AXSHORT[a]} <span class="blur"></span></div>`).join('');
  el.innerHTML = `
   <div class="card gate">
     <p class="eyebrow">🎉 Bản đồ của ${cw} đã sẵn sàng</p>
     <h2>Đã chấm xong ${q.axes.length} trục phát triển của ${cw}</h2>
     <p class="lead" style="margin-bottom:10px">Nhập thông tin để mở Bản đồ phát triển + <b>3 việc làm ngay tuần này</b>. Báo cáo cũng được gửi tới Zalo để anh/chị lưu lại.</p>
     <div class="teaser">${axRows}</div>
     <input class="field" id="pname" placeholder="Tên anh/chị (để xưng hô)" />
     <input class="field" id="cname" placeholder="${cw==='bé'?'Tên ở nhà của bé':'Tên / biệt danh của con'} (để gọi)" />
     <input class="field" id="zalo" placeholder="Số Zalo nhận báo cáo (vd: 09xx xxx xxx)" inputmode="numeric" type="tel" pattern="0[35789][0-9]{8}" oninput="this.value=this.value.replace(/[^0-9]/g,'')" />
     <label class="consent"><input type="checkbox" id="cs" /> Tôi đồng ý Trường Việt Anh liên hệ tư vấn và xử lý dữ liệu của tôi &amp; của con theo <b>Luật Bảo vệ dữ liệu cá nhân số 91/2025/QH15</b> (bao gồm dữ liệu trẻ em).</label>
     <button class="btn gold" id="unlock" disabled>Xem Bản đồ của ${cw} + 3 việc làm ngay</button>
     <span class="backlink" id="bk">← Quay lại</span>
     <p class="note">Bản đồ mang tính tham khảo để cùng đồng hành, không thay thế chẩn đoán giáo dục/tâm lý chuyên môn.</p>
   </div>`;
  const z=document.getElementById('zalo'), cs=document.getElementById('cs'), btn=document.getElementById('unlock'), cn=document.getElementById('cname');
  function chk(){ btn.disabled=!( /^0[35789]\d{8}$/.test(z.value.replace(/\D/g,'').replace(/^84(?=\d{9}$)/,'0')) && cs.checked ); }
  z.oninput=chk; cs.onchange=chk;
  btn.onclick=async()=>{
    state.childName=(cn.value||'').trim()||cw;
    btn.disabled=true; btn.textContent='Đang xử lý…';

    // Thu thập dữ liệu quiz để gửi lên webhook
    const scores=computeScores(), q=CUR();
    const scoreMap={}; q.axes.forEach((a,i)=>{ scoreMap[a]=scores[i]; });
    let gradeLabel='';
    MENU.forEach(lv=>{
      if(lv.quiz===state.quizId) gradeLabel=lv.label;
      if(lv.groups) lv.groups.forEach(g=>{ if(g.quiz===state.quizId) gradeLabel=lv.label+' · '+g.label; });
    });
    const payload={
      parentName:(document.getElementById('pname').value||'').trim(),
      childName:state.childName,
      phone:z.value.trim(),
      quizId:state.quizId,
      classLabel:state.classLabel||'',
      gradeLabel,
      offerType:q.offer,
      scores:scoreMap,
      source:'quiz-vietanh',
      submittedAt:new Date().toISOString()
    };
    try{
      await fetch('https://n8n.truongvietanh.com/webhook/quiz-vietanh-lead',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
    }catch(e){ console.warn('Webhook error:',e); }

    // Gửi lead vào GHL + Pancake qua /api/lead (giống form 2-step cũ). Đọc ?src từ trang pillar.
    try{
      const sp=new URLSearchParams(location.search);
      // schoolLevel: ưu tiên ?src (trang pillar), nếu không có thì suy từ cấp học đã chọn
      const levelMap={'mam-non-pillar':'mau-non','tieu-hoc-pillar':'tieu-hoc','thcs-pillar':'thcs','thpt-pillar':'thpt'};
      let schoolLevel=levelMap[sp.get('src')]||'';
      if(!schoolLevel){ const g=(gradeLabel||'').toLowerCase(); if(g.includes('mầm'))schoolLevel='mau-non'; else if(g.includes('tiểu'))schoolLevel='tieu-hoc'; else if(g.includes('thcs'))schoolLevel='thcs'; else if(g.includes('thpt'))schoolLevel='thpt'; }
      // funnel_code RIÊNG theo cấp học (giữ ?src marketer đặt nếu có) → cột "Diễn giải nguồn MKT" tách được cấp
      const src=sp.get('src')||('quiz-vietanh'+(schoolLevel?'-'+schoolLevel:''));
      await fetch('/api/lead',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify(Object.assign({
          step:'full_submit',
          fullName:payload.parentName, parent_name:payload.parentName,
          email:'',
          phone:payload.phone,
          childName:payload.childName, child_name:payload.childName,
          schoolLevel, school_level:schoolLevel,
          grade:gradeLabel,
          source:src, funnelCode:src, funnel_code:src,
          page:location.href,
          timestamp:payload.submittedAt,
          referrer:document.referrer||''
        },(window.__vaUTM||(window.__vaUTM=function(){var k=['utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_pke_mkter','pke_mkter'],o={};try{var p=new URLSearchParams(location.search);k.forEach(function(x){var g=p.get(x);if(g){try{sessionStorage.setItem('va_'+x,g)}catch(e){}}var v=g||(function(){try{return sessionStorage.getItem('va_'+x)}catch(e){return ''}})()||'';if(v)o[x]=v})}catch(e){}if(!o.utm_source){o.utm_source='direct';o.utm_medium='none'}o.page_url=location.href;return o}))()))
      });
    }catch(e){ console.warn('Lead API error:',e); }

    renderResult();
  };
  document.getElementById('bk').onclick=()=>{ state.idx=CUR().questions.length-1; renderQuestion(); };
}

function computeScores(){
  const q=CUR(), n=q.axes.length;
  const sum=Array(n).fill(0), cnt=Array(n).fill(0);
  state.answers.forEach(a=>{ sum[a.axis]+=SC[a.bucket]; cnt[a.axis]++; });
  return sum.map((s,i)=> cnt[i]? Math.round(s/cnt[i]) : 60);
}

function renderResult(){
  const q=CUR(), scores=computeScores(), nm=state.childName||q.childWord;
  let hi=0, lo=0; scores.forEach((s,i)=>{ if(s>scores[hi])hi=i; if(s<scores[lo])lo=i; });
  el.innerHTML = `
   <div class="card">
     <p class="eyebrow">✅ Đã mở khoá • Bản đồ phát triển</p>
     <h2>Bản đồ phát triển của ${nm}</h2>
     <p class="lead" style="margin-bottom:8px">Theo đúng ${q.axes.length} trục của Việt Anh — mang tính tham khảo để cùng đồng hành, không phải đánh giá xếp loại.</p>
     <div class="radar-wrap" id="radar"></div>
     <div class="scoreline">
       ${scores.map((s,i)=>`<div class="axisrow"><span class="nm">${AXSHORT[q.axes[i]]}</span><span class="track"><i style="width:${s}%"></i></span><span class="pc">${s}</span></div>`).join('')}
     </div>
     <div class="insightbox strong"><b>✨ Điểm sáng: ${AXSHORT[q.axes[hi]]}.</b> ${q.strong[hi]}</div>
     <div class="insightbox grow"><b>🌱 Vùng nên đồng hành: ${AXSHORT[q.axes[lo]]}.</b> Việt Anh có thể ${q.grow[lo]}.</div>
     <div class="todo"><h3>📌 3 việc làm ngay tuần này cho ${nm}</h3>
       <ol>${q.todo[lo].map(t=>`<li>${t}</li>`).join('')}</ol></div>
     <button class="btn" id="toOffer">Cho ${q.childWord} trải nghiệm thật một buổi tại trường →</button>
     <p class="note">Số liệu trong báo cáo đều có nguồn. Bản đồ không thay thế chẩn đoán chuyên môn.</p>
   </div>`;
  drawRadar(scores, q.axes.map(a=>AXSHORT[a]));
  document.getElementById('toOffer').onclick=renderOffer;
}

function drawRadar(scores, labels){
  const size=260, c=size/2, R=84, N=scores.length;
  const ang=i=>(-Math.PI/2)+i*2*Math.PI/N;
  const pt=(i,r)=>[c+r*Math.cos(ang(i)), c+r*Math.sin(ang(i))];
  let rings=''; [0.25,0.5,0.75,1].forEach(f=>{ let p='';
    for(let i=0;i<N;i++){const[x,y]=pt(i,R*f); p+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';}
    rings+=`<path d="${p}Z" fill="none" stroke="#dbe7f8" stroke-width="1"/>`; });
  let axesL=''; for(let i=0;i<N;i++){const[x,y]=pt(i,R); axesL+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#dbe7f8"/>`;}
  let poly=''; for(let i=0;i<N;i++){const[x,y]=pt(i,R*scores[i]/100); poly+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';}
  let dots=''; for(let i=0;i<N;i++){const[x,y]=pt(i,R*scores[i]/100); dots+=`<circle cx="${x}" cy="${y}" r="3.4" fill="#0a5ad6"/>`;}
  let lbl=''; for(let i=0;i<N;i++){ const a=ang(i), cx=Math.cos(a), cy=Math.sin(a);
    const lx=c+(R+16)*cx, ly=c+(R+16)*cy;
    const anchor=cx>0.3?'start':(cx<-0.3?'end':'middle'); const dy=cy<-0.3?-2:(cy>0.3?12:4);
    lbl+=`<text x="${lx.toFixed(1)}" y="${(ly+dy).toFixed(1)}" font-size="10.5" font-weight="700" fill="#33506f" text-anchor="${anchor}">${labels[i]}</text>`; }
  document.getElementById('radar').innerHTML =
    `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" overflow="visible">
       ${rings}${axesL}<path d="${poly}Z" fill="rgba(15,181,166,.22)" stroke="#0fb5a6" stroke-width="2"/>${dots}${lbl}</svg>`;
}

function renderOffer(){
  const q=CUR(), cfg=OFFER[q.offer], nm=state.childName||q.childWord;
  el.innerHTML = `
   <div class="card offer">
     <p class="eyebrow">Bước cuối</p>
     <h2>Để ${nm} trải nghiệm thật một buổi tại trường</h2>
     <p class="lead">Báo cáo đầy đủ đã được gửi tới Zalo của anh/chị. Nhưng không gì bằng để ${q.childWord} <b>trải nghiệm thật một buổi</b> — anh/chị nhìn tận mắt lớp ≤24 em, giáo viên nước ngoài và cách thầy cô đồng hành.</p>
     <div class="pts">${cfg.pts.map(p=>`<div class="pt"><span class="c">✓</span> ${p}</div>`).join('')}</div>
     <div class="guarantee"><span class="g-ic">🛡️</span><span><b>Bảo đảm:</b> Trải nghiệm miễn phí, không đặt cọc, không ràng buộc. Phụ huynh/học sinh có thêm trải nghiệm để nâng cao chất lượng quyết định.</span></div>
     <button class="btn" id="book">${cfg.book}</button>
     <button class="btn ghost" id="restart" style="margin-top:10px">Làm lại cho con khác</button>
     <p class="note">Lịch tham quan theo đợt tuyển sinh thật của trường — anh/chị chọn khung giờ phù hợp với gia đình.</p>
   </div>`;
  document.getElementById('book').onclick=()=>{
    el.querySelector('h2').textContent='Cảm ơn anh/chị! 🌷';
    el.querySelector('.lead').innerHTML='Bộ phận Tuyển sinh Việt Anh sẽ gọi qua Zalo trong hôm nay để hẹn khung giờ tham quan & học thử phù hợp với gia đình. Hẹn gặp anh/chị và con tại trường!';
    el.querySelectorAll('.pts,.guarantee,#book').forEach(n=>n&&n.classList.add('hide'));
  };
  document.getElementById('restart').onclick=()=>{ progressWrap.style.display='none'; renderWelcome(); };
}

renderWelcome();
